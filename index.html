<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>qr</title>
	<script type="text/javascript" src="node_modules/qrcode-generator/dist/qrcode.js"></script>
	<link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
	<form>
		<label>
			<span>Upload an image</span>
			<input type="file" id="upload">
		</label>
		<label>
			<span>QR code text</span>
			<input id="text" value="https://www.andrewt.net">
		</label>
		<label>
			<span>Gamma</span>
			<input id="gamma" value="2.2">
		</label>
		<label>
			<span>Contrast</span>
			<input id="contrast" value="1.0">
		</label>
		<label>
			<span>Brightness</span>
			<input id="brightness" value="0.0">
		</label>
		<label>
			<span>Subpixel ratio</span>
			<input id="ratio" type="number" value="3">
		</label>
	</form>
	<img id="img" src="img2.png">
	<canvas id="canvas" width="99" height="99"></canvas>
	<div id="placeHolder"></div>
	<script type="text/javascript" src="script.js"></script>
</body>
</html>
